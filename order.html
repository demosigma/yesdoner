<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Web App</title>
</head>
<body>
    <h1>Your Menu</h1>
    <button id="sendOrderBtn">Send Order</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;

        tg.expand();

        // Example order data
        const orderData = JSON.stringify([
            { name: "Burger", count: 2, totalPrice: 2000 },
            { name: "Soda", count: 1, totalPrice: 500 }
        ]);

        document.getElementById("sendOrderBtn").addEventListener("click", function() {
            console.log("Sending order data:", orderData);
            tg.sendData(orderData);
            tg.close();
        });
    </script>
</body>
</html>
